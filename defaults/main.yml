---
# Where logs are forwarded. A list because a host ships to two places during a
# migration: the destination being retired and the one replacing it. Each entry
# takes `host`, `port`, and optionally `framing`.
#
# `framing` is omitted by default, which leaves rsyslog's own default
# (non-transparent, newline-delimited). Set it to `octet-counted` for a
# receiver that asks for it — RFC 6587 calls that the recommended method, and
# without it the receiver must wait for the *next* message to know the current
# one ended, so a quiet host's last line sits in limbo.
syslog_destinations:
  - host: "{{ syslog_graylog_url }}"
    port: "{{ syslog_graylog_port }}"

# Deprecated, and referenced by the default above only so that playbooks
# setting them keep working unchanged. Set `syslog_destinations` instead.
syslog_graylog_url: graylog.local.iamrobertyoung.co.uk
syslog_graylog_port: 5140

# syslog_fqdn: Required - Fully qualified domain name of the host (used for TLS certificate paths)
