---
- name: Converge
  hosts: all
  become: true
  vars:
    syslog_fqdn: "test.example.com"
  roles:
    # No syslog_destinations override: the default is what every consuming
    # repo now gets from a version bump, so it is the thing worth testing.
    # Overriding it is still supported and is what a future migration uses.
    - role: robertyoung.syslog
